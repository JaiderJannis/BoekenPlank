<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mijn BoekenPlank Pro</title>

    <!-- Tailwind CSS voor de styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel standalone om React (JSX) direct in de browser te compileren -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- HTML5 QRCode scanner voor de ISBN camera functie -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

</head>
<body class="bg-stone-100 text-stone-800 overflow-hidden h-screen flex flex-col">
    <div id="root" class="h-full w-full flex flex-col"></div>

    <!-- === ✂️ BESTAND 3: APP.JS (of APP.JSX) ✂️ === -->
    <!-- 
      Als je dit opsplitst op je eigen server: 
      1. Maak een bestand 'app.js' aan en plak alle JavaScript code erin (zonder de <script> tags).
      2. Vervang deze hele script tag in je HTML door: <script src="app.js" type="text/babel" data-type="module"></script>
    -->

</body>
</html>
