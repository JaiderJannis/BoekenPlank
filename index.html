<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- App Titel -->
    <title>BoekenPlank</title>
    <meta name="apple-mobile-web-app-title" content="BoekenPlank">
    <meta name="application-name" content="BoekenPlank">

    <!-- Kleur van de statusbalk bovenaan de telefoon (komt overeen met bg-stone-100) -->
    <meta name="theme-color" content="#f5f5f4">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Icoontje voor op het startscherm van iPhone / iPad (Apple Touch Icon) -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <!-- Standaard favicons voor de browser tabbladen (Computer / Android) -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    
    <!-- Optioneel: Standaard .ico bestand als terugval voor hele oude browsers -->
    <link rel="icon" href="favicon.ico">

    <!-- Tailwind CSS voor de styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel standalone om React (JSX) direct in de browser te compileren -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- HTML5 QRCode scanner voor de ISBN camera functie -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <!-- Koppel je eigen CSS bestand -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-stone-100 text-stone-800 overflow-hidden h-screen flex flex-col">
    <div id="root" class="h-full w-full flex flex-col"></div>

    <!-- Laad je eigen JS bestand in via Babel -->
    <script src="app.js" type="text/babel" data-type="module"></script>
</body>
</html>
